name: PR workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  rustfmt-nightly-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Cargo: fmt"
        run: |
          rustup toolchain install nightly --profile minimal -c rustfmt
          cargo +nightly fmt -- --check

  clippy-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Cargo: clippy"
        run: |
          sudo apt-get update && sudo apt-get install -y libseccomp-dev
          rustup toolchain install stable --profile minimal -c clippy
          cargo +stable clippy --features seccomp -- -D warnings

  seccomp-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Cargo: test with seccomp"
        run: |
          sudo apt-get update && sudo apt-get install -y libseccomp-dev
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked --profile fast --features seccomp

  build-and-test:
    uses: ./.github/workflows/build-artifacts-and-run-tests.yml
    with:
      matrix_all_combinations: false
      artifact_upload_mode: none
